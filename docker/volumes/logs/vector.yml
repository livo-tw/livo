api:
  enabled: true
  address: 0.0.0.0:9001

sources:
  docker_host:
    type: docker_logs
    exclude_containers:
      - supabase-vector

transforms:
  project_logs:
    type: remap
    inputs:
      - docker_host
    source: |-
      .project = "default"
      .event_message = del(.message)
      .appname = del(.container_name)
      del(.container_created_at)
      del(.container_id)
      del(.source_type)
      del(.stream)
      del(.label)
      del(.image)
      del(.host)
      del(.stream)
  router:
    type: route
    inputs:
      - project_logs
    route:
      kong: '.appname == "supabase-kong"'
      auth: '.appname == "supabase-auth"'
      rest: '.appname == "supabase-rest"'
      realtime: '.appname == "realtime-dev.supabase-realtime"'
      storage: '.appname == "supabase-storage"'
      functions: '.appname == "supabase-edge-functions"'
      db: '.appname == "supabase-db"'
  # Classify once, then route exclusively. Unknown/boot messages must survive
  # exactly once instead of aborting in both the access and error parsers.
  kong_classify:
    type: remap
    inputs:
      - router.kong
    source: |-
      message = to_string(.event_message) ?? ""
      access, access_error = parse_nginx_log(message, "combined")
      if access_error == null {
        ._livo_kong_kind = "access"
        ._livo_kong_parsed = access
      } else {
        error, error_parse_error = parse_nginx_log(message, "error")
        if error_parse_error == null {
          ._livo_kong_kind = "error"
          ._livo_kong_parsed = error
        } else {
          ._livo_kong_kind = "unknown"
        }
      }
  kong_classified:
    type: route
    inputs:
      - kong_classify
    route:
      access: '._livo_kong_kind == "access"'
      error: '._livo_kong_kind == "error"'
      unknown: '._livo_kong_kind == "unknown"'
  kong_logs:
    type: remap
    inputs:
      - kong_classified.access
    source: |-
      req = del(._livo_kong_parsed)
      del(._livo_kong_kind)
      .timestamp = req.timestamp
      .metadata.request.headers.referer = req.referer
      .metadata.request.headers.user_agent = req.agent
      .metadata.request.headers.cf_connecting_ip = req.client
      .metadata.response.status_code = req.status
      parts = split(to_string(req.request) ?? "", " ")
      if length(parts) == 3 {
        .metadata.request.method = parts[0]
        .metadata.request.path = parts[1]
        .metadata.request.protocol = parts[2]
      }
  kong_logs_filtered:
    type: filter
    inputs:
      - kong_logs
    # Only proven, successful access records enter this filter. The error
    # branch's legacy synthetic status=200 never qualifies as an access log.
    condition: |-
      method = string(.metadata.request.method) ?? ""
      status = to_int(.metadata.response.status_code) ?? 0
      path = string(.metadata.request.path) ?? ""
      query_parts = split(path, "?")
      path = string(query_parts[0]) ?? ""
      path = replace(path, r'/+$', "")
      low_value_path = includes([
        "/health", "/healthz", "/ready", "/auth/v1/health",
        "/storage/v1/status", "/realtime/v1/health",
        "/rest/v1/field_locks"
      ], path)
      !(includes(["GET", "HEAD"], method) && status >= 200 && status < 300 && low_value_path)
  kong_err:
    type: remap
    inputs:
      - kong_classified.error
    source: |-
      parsed = del(._livo_kong_parsed)
      del(._livo_kong_kind)
      .metadata.request.method = "GET"
      .metadata.response.status_code = 200
      .timestamp = parsed.timestamp
      .severity = parsed.severity
      .metadata.request.host = parsed.host
      .metadata.request.headers.cf_connecting_ip = parsed.client
      parts = split(to_string(parsed.request) ?? "", " ")
      if length(parts) == 3 {
        .metadata.request.method = parts[0]
        .metadata.request.path = parts[1]
        .metadata.request.protocol = parts[2]
      }
  kong_unknown:
    type: remap
    inputs:
      - kong_classified.unknown
    source: |-
      del(._livo_kong_kind)
      del(._livo_kong_parsed)
      .metadata.log_parser = "unparsed"
  # Gotrue logs are structured json strings which frontend parses directly. But we keep metadata for consistency.
  auth_logs:
    type: remap
    inputs:
      - router.auth
    source: |-
      parsed, err = parse_json(.event_message)
      if err == null {
          .metadata.timestamp = parsed.time
          .metadata = merge!(.metadata, parsed)
      }
  # PostgREST logs are structured so we separate timestamp from message using regex
  rest_logs:
    type: remap
    inputs:
      - router.rest
    source: |-
      parsed, err = parse_regex(.event_message, r'^(?P<time>.*): (?P<msg>.*)$')
      if err == null {
          .event_message = parsed.msg
          .timestamp = parse_timestamp!(value: parsed.time,format: "%d/%b/%Y:%H:%M:%S %z")
          .metadata.host = .project
      }
  # Realtime's unstructured messages do not prove a successful HTTP status.
  # Keep them, including health-related warnings/errors. Only the parsed Kong
  # access branch performs the bounded successful-poll filter above.
  # Realtime logs are structured so we parse the severity level using regex (ignore time because it has no date)
  realtime_logs:
    type: remap
    inputs:
      - router.realtime
    source: |-
      .metadata.project = del(.project)
      .metadata.external_id = .metadata.project
      parsed, err = parse_regex(.event_message, r'^(?P<time>\d+:\d+:\d+\.\d+) \[(?P<level>\w+)\] (?P<msg>.*)$')
      if err == null {
          .event_message = parsed.msg
          .metadata.level = parsed.level
      }
  # Function logs are unstructured messages on stderr
  functions_logs:
    type: remap
    inputs:
      - router.functions
    source: |-
      .metadata.project_ref = del(.project)
  # Storage logs may contain json objects so we parse them for completeness
  storage_logs:
    type: remap
    inputs:
      - router.storage
    source: |-
      .metadata.project = del(.project)
      .metadata.tenantId = .metadata.project
      parsed, err = parse_json(.event_message)
      if err == null {
          .event_message = parsed.msg
          .metadata.level = parsed.level
          .metadata.timestamp = parsed.time
          .metadata.context[0].host = parsed.hostname
          .metadata.context[0].pid = parsed.pid
      }
  # Postgres logs some messages to stderr which we map to warning severity level
  db_logs:
    type: remap
    inputs:
      - router.db
    source: |-
      .metadata.host = "db-default"
      .metadata.parsed.timestamp = .timestamp

      parsed, err = parse_regex(.event_message, r'.*(?P<level>INFO|NOTICE|WARNING|ERROR|LOG|FATAL|PANIC?):.*', numeric_groups: true)

      if err != null || parsed == null {
        .metadata.parsed.error_severity = "info"
      }
      if parsed.level != null {
       .metadata.parsed.error_severity = parsed.level
      }
      if .metadata.parsed.error_severity == "info" {
          .metadata.parsed.error_severity = "log"
      }
      .metadata.parsed.error_severity = upcase!(.metadata.parsed.error_severity)

sinks:
  logflare_auth:
    type: 'http'
    inputs:
      - auth_logs
    encoding:
      codec: 'json'
    method: 'post'
    request:
      retry_max_duration_secs: 30
      retry_initial_backoff_secs: 1
      headers:
        x-api-key: ${LOGFLARE_PUBLIC_ACCESS_TOKEN?LOGFLARE_PUBLIC_ACCESS_TOKEN is required}
    uri: 'http://analytics:4000/api/logs?source_name=gotrue.logs.prod'
  logflare_realtime:
    type: 'http'
    inputs:
      - realtime_logs
    encoding:
      codec: 'json'
    method: 'post'
    request:
      retry_max_duration_secs: 30
      retry_initial_backoff_secs: 1
      headers:
        x-api-key: ${LOGFLARE_PUBLIC_ACCESS_TOKEN?LOGFLARE_PUBLIC_ACCESS_TOKEN is required}
    uri: 'http://analytics:4000/api/logs?source_name=realtime.logs.prod'
  logflare_rest:
    type: 'http'
    inputs:
      - rest_logs
    encoding:
      codec: 'json'
    method: 'post'
    request:
      retry_max_duration_secs: 30
      retry_initial_backoff_secs: 1
      headers:
        x-api-key: ${LOGFLARE_PUBLIC_ACCESS_TOKEN?LOGFLARE_PUBLIC_ACCESS_TOKEN is required}
    uri: 'http://analytics:4000/api/logs?source_name=postgREST.logs.prod'
  logflare_db:
    type: 'http'
    inputs:
      - db_logs
    encoding:
      codec: 'json'
    method: 'post'
    request:
      retry_max_duration_secs: 30
      retry_initial_backoff_secs: 1
      headers:
        x-api-key: ${LOGFLARE_PUBLIC_ACCESS_TOKEN?LOGFLARE_PUBLIC_ACCESS_TOKEN is required}
    # Route directly to analytics like other sinks. Retry handles the startup
    # race where analytics may not be ready yet when early DB logs arrive.
    uri: 'http://analytics:4000/api/logs?source_name=postgres.logs'
  logflare_functions:
    type: 'http'
    inputs:
      - functions_logs
    encoding:
      codec: 'json'
    method: 'post'
    request:
      retry_max_duration_secs: 30
      retry_initial_backoff_secs: 1
      headers:
        x-api-key: ${LOGFLARE_PUBLIC_ACCESS_TOKEN?LOGFLARE_PUBLIC_ACCESS_TOKEN is required}
    uri: 'http://analytics:4000/api/logs?source_name=deno-relay-logs'
  logflare_storage:
    type: 'http'
    inputs:
      - storage_logs
    encoding:
      codec: 'json'
    method: 'post'
    request:
      retry_max_duration_secs: 30
      retry_initial_backoff_secs: 1
      headers:
        x-api-key: ${LOGFLARE_PUBLIC_ACCESS_TOKEN?LOGFLARE_PUBLIC_ACCESS_TOKEN is required}
    uri: 'http://analytics:4000/api/logs?source_name=storage.logs.prod.2'
  logflare_kong:
    type: 'http'
    inputs:
      - kong_logs_filtered
      - kong_err
      - kong_unknown
    encoding:
      codec: 'json'
    method: 'post'
    request:
      retry_max_duration_secs: 30
      retry_initial_backoff_secs: 1
      headers:
        x-api-key: ${LOGFLARE_PUBLIC_ACCESS_TOKEN?LOGFLARE_PUBLIC_ACCESS_TOKEN is required}
    uri: 'http://analytics:4000/api/logs?source_name=cloudflare.logs.prod'
