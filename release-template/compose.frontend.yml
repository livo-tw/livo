# ============================================================
# LIVO frontend (static SPA) served inside Docker.
# No Node.js needed on the host — the bundled server.cjs runs
# in a node:20-alpine container.
#
# Used together with docker-compose.yml (run inside docker/):
#   docker compose -f docker-compose.yml -f compose.frontend.yml up -d
#
# Change the host port: add a line to docker/.env, e.g.
#   LIVO_FRONTEND_PORT=3001
# ============================================================
services:
  livo-frontend:
    container_name: livo-frontend
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /srv/app
    environment:
      PORT: "3000"
      APP_BASE_URL: ${APP_BASE_URL:-}
      LIVO_API_UPSTREAM: http://kong:8000
    # Both compose files run as one project (name: supabase in docker-compose.yml).
    # Kong and this service share its default network; host port overrides do
    # not change Kong's internal port 8000.
    networks:
      - default
    command: ["node", "server.cjs"]
    volumes:
      - ../app:/srv/app:ro
    ports:
      - "${LIVO_FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional durable notification poller. Enable with COMPOSE_PROFILES=slack-delivery.
  livo-slack-delivery:
    image: curlimages/curl:latest
    profiles: [slack-delivery]
    restart: unless-stopped
    read_only: true
    environment:
      SLACK_INTERNAL_SECRET: ${SLACK_INTERNAL_SECRET:-}
      ANON_KEY: ${ANON_KEY}
    depends_on:
      kong:
        condition: service_healthy
    # Headers go to curl on stdin (-H @-) from the shell's printf builtin, so the
    # secret never appears in a process command line (/proc/*/cmdline, ps).
    entrypoint:
      - /bin/sh
      - -c
      - |
        while true; do
          printf 'Authorization: Bearer %s\nx-livo-slack-secret: %s\n' "$${ANON_KEY}" "$${SLACK_INTERNAL_SECRET}" |
            curl --silent --max-time 55 --output /dev/null -X POST -H @- http://kong:8000/functions/v1/slack-deliver || true
          sleep 5
        done

  # Optional outbound-only Slack transport. An empty app token exits successfully.
  livo-slack-socket:
    image: node:22-alpine
    restart: "on-failure:5"
    init: true
    read_only: true
    command: ["node", "/relay/slack-socket.mjs"]
    environment:
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN:-}
      SLACK_INTERNAL_SECRET: ${SLACK_INTERNAL_SECRET:-}
      ANON_KEY: ${ANON_KEY}
    volumes:
      - ../app/slack-socket.mjs:/relay/slack-socket.mjs:ro
    depends_on:
      kong:
        condition: service_healthy
    networks:
      - default
